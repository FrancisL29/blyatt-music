<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio Automix</title>
<style>
  :root { --bg: #0b0d10; --panel: #14171c; --panel2: #1b1f26; --line: #262b33; --text: #eef0f3; --muted: #8d95a3;
          --acc: #7fd1ff; --a: #6fb6ff; --b: #ffd166; --voc: #ff7ab8; --ok: #6be3a4; --bad: #ff7b7b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 20px 16px 80px; }
  .head { display: flex; gap: 18px; align-items: flex-end; margin-bottom: 18px; }
  .mosaic { width: 132px; height: 132px; border-radius: 10px; overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; background: var(--panel2); flex: none; }
  .mosaic img { width: 100%; height: 100%; object-fit: cover; }
  .head h1 { margin: 0 0 4px; font-size: 30px; letter-spacing: -.5px; }
  .head .sub { color: var(--muted); }
  .bar { display: flex; align-items: center; gap: 10px; margin: 6px 0 14px; flex-wrap: wrap; }
  .pill { display: inline-flex; align-items: center; gap: 8px; background: var(--panel2); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; cursor: pointer; user-select: none; }
  .sw { width: 34px; height: 20px; border-radius: 99px; background: #3a414c; position: relative; transition: background .15s; }
  .sw::after { content: ""; position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #fff; top: 2px; left: 2px; transition: left .15s; }
  .on .sw { background: var(--acc); } .on .sw::after { left: 16px; }
  .srch { position: relative; flex: 1; min-width: 220px; }
  .srch input { width: 100%; padding: 9px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; }
  .res { position: absolute; left: 0; right: 0; top: 44px; background: #11151a; border: 1px solid var(--line); border-radius: 12px; z-index: 20; max-height: 380px; overflow: auto; display: none; box-shadow: 0 12px 40px rgb(0 0 0 / .5); }
  .res div { display: flex; gap: 10px; align-items: center; padding: 8px 12px; cursor: pointer; }
  .res div:hover { background: var(--panel2); }
  .res img { width: 38px; height: 38px; border-radius: 6px; object-fit: cover; }
  .res small { color: var(--muted); display: block; }
  .row { display: grid; grid-template-columns: 48px 1fr auto auto auto; gap: 12px; align-items: center; padding: 8px 8px; border-radius: 8px; }
  .row:hover { background: #12161b; }
  .row img { width: 48px; height: 48px; border-radius: 6px; object-fit: cover; background: var(--panel2); }
  .row .tt { min-width: 0; } .row .tt b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .tt span { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .meta { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: 12.5px; white-space: nowrap; }
  .key { border-radius: 6px; padding: 1px 6px; font-weight: 700; font-size: 11.5px; color: #0b0d10; }
  .x { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 16px; padding: 4px 6px; border-radius: 6px; }
  .x:hover { background: var(--panel2); color: var(--text); }
  .busy { color: #ffb86b; font-size: 12.5px; }
  .tr { margin: 0 0 0 68px; padding: 2px 0; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 3px 10px 3px 8px; cursor: pointer; font-size: 12.5px; color: var(--muted); }
  .chip:hover { border-color: #3b4450; color: var(--text); }
  .chip b { color: var(--acc); font-weight: 600; }
  .chip.custom b { color: var(--b); }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; }
  /* editor */
  .sheet { position: fixed; inset: 0; background: rgb(0 0 0 / .6); display: none; z-index: 50; align-items: flex-end; justify-content: center; }
  .sheet.open { display: flex; }
  .ed { width: min(860px, 100%); max-height: 96vh; overflow: auto; background: #101318; border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 12px 16px 20px; }
  .edh { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-bottom: 8px; }
  .edh h3 { margin: 0; font-size: 15px; text-align: center; }
  .edh .beta { font-size: 10px; background: var(--acc); color: #04121a; border-radius: 4px; padding: 1px 5px; margin-left: 6px; vertical-align: 2px; }
  .lnk { background: none; border: 0; color: var(--text); font: inherit; cursor: pointer; justify-self: start; padding: 6px 4px; }
  .save { justify-self: end; background: var(--acc); color: #04121a; border: 0; border-radius: 999px; padding: 6px 16px; font-weight: 700; cursor: pointer; }
  .trk { display: flex; gap: 10px; align-items: center; padding: 6px 0; }
  .trk img { width: 40px; height: 40px; border-radius: 5px; object-fit: cover; }
  .trk .tt b { display: block; } .trk .tt span { color: var(--muted); font-size: 12.5px; }
  .trk .meta { margin-left: auto; }
  .stage { position: relative; }
  canvas.ed-cv { width: 100%; height: 300px; display: block; background: #0c0f13; border-radius: 10px; cursor: pointer; }
  .play { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 52px; height: 52px; border-radius: 50%; border: 0; background: rgb(255 255 255 / .92); color: #0b0d10; font-size: 20px; cursor: pointer; box-shadow: 0 6px 24px rgb(0 0 0 / .5); }
  .play.hide { opacity: .0; } .stage:hover .play.hide { opacity: .85; }
  .ctl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  select, .btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .btn:hover { background: #232934; }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer; text-align: left; color: var(--text); font: inherit; }
  .pre small { display: block; color: var(--muted); font-size: 11px; }
  .pre.sel { border-color: var(--acc); background: #12202a; }
  .pre:disabled { opacity: .35; cursor: default; }
  .why { color: var(--muted); font-size: 12.5px; margin: 8px 0 0; padding-left: 18px; }
  .leg { display: flex; gap: 14px; flex-wrap: wrap; font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .leg i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 5px; }
  .info { color: var(--muted); font-size: 12px; margin-top: 6px; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="mosaic" id="mosaic"></div>
    <div><div class="sub">Lista · laboratorio</div><h1>Mezcla de prueba</h1><div class="sub" id="sub">Añade canciones para empezar</div></div>
  </div>
  <div class="bar">
    <span class="pill on" id="amx"><span class="sw"></span>Automix</span>
    <span class="pill on" id="stm" title="Separar la voz (Spleeter) para voz primero / instrumental primero"><span class="sw"></span>Voz separada</span>
    <div class="srch"><input id="q" placeholder="Añadir canciones…" autocomplete="off"><div class="res" id="res"></div></div>
  </div>
  <div id="list"></div>
</div>
<div class="sheet" id="sheet"><div class="ed" id="ed"></div></div>
<script>
const $ = (s, r = document) => r.querySelector(s);
const esc = (x) => String(x == null ? "" : x).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const jget = async (u, o) => { const r = await fetch(u, o); const d = await r.json(); if (!r.ok) throw new Error(d.error || r.status); return d; };
const LS = "automixlab.v1";
const S = { list: [], an: {}, plans: {}, custom: {}, amx: true, stems: true };
try { Object.assign(S, JSON.parse(localStorage.getItem(LS) || "{}"), { an: {}, plans: {} }); } catch (e) {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify({ list: S.list, custom: S.custom, amx: S.amx, stems: S.stems })); } catch (e) {} };
const fmt = (t) => Math.floor(t / 60) + ":" + String(Math.floor(t % 60)).padStart(2, "0");
const keyCol = (k) => k ? `hsl(${((k.cam - 1) * 30 + 10) % 360} 70% ${k.letter === "B" ? 68 : 58}%)` : "#555";
const pairKey = (a, b) => a + ">" + b;

// ---------- buscar y anadir
let tmr = null;
$("#q").addEventListener("input", () => {
  clearTimeout(tmr); const v = $("#q").value.trim();
  if (!v) { $("#res").style.display = "none"; return; }
  tmr = setTimeout(async () => {
    const items = await jget("/api/search?q=" + encodeURIComponent(v));
    $("#res").innerHTML = items.map((it, i) => `<div data-i="${i}"><img src="${esc(it.cover)}" alt=""><span>${esc(it.title)}<small>${esc(it.artist)} · ${esc(it.duration)}</small></span></div>`).join("") || '<div class="empty">Sin resultados</div>';
    $("#res").style.display = "block";
    $("#res").querySelectorAll("[data-i]").forEach(el => el.onmousedown = () => { add(items[+el.dataset.i]); $("#q").value = ""; $("#res").style.display = "none"; });
  }, 280);
});
$("#q").addEventListener("blur", () => setTimeout(() => $("#res").style.display = "none", 150));
$("#amx").onclick = () => { S.amx = !S.amx; save(); paint(); };
$("#stm").onclick = () => { S.stems = !S.stems; S.plans = {}; save(); paint(); };

function add(it) { S.list.push({ id: it.id, title: it.title, artist: it.artist, duration: it.duration, cover: it.cover }); save(); paint(); }
function removeAt(i) { S.list.splice(i, 1); save(); paint(); }
function move(i, d) { const j = i + d; if (j < 0 || j >= S.list.length) return; [S.list[i], S.list[j]] = [S.list[j], S.list[i]]; save(); paint(); }

const pending = {};
async function analyze(s) {
  if (S.an[s.id] || pending[s.id]) return;
  pending[s.id] = true;
  try { S.an[s.id] = await jget(`/api/analyze?id=${s.id}&title=${encodeURIComponent(s.title)}&artist=${encodeURIComponent(s.artist)}&dur=${encodeURIComponent(s.duration || "")}&stems=${S.stems ? 1 : 0}`); }
  catch (e) { S.an[s.id] = { error: e.message }; }
  delete pending[s.id]; paint();
}
async function getPlans(a, b, bars) {
  const k = pairKey(a, b) + (bars ? "@" + bars : "");
  if (!S.plans[k]) S.plans[k] = jget(`/api/plan?a=${a}&b=${b}&stems=${S.stems ? 1 : 0}${bars ? "&bars=" + bars : ""}`);
  return S.plans[k];
}

// ---------- lista
function paint() {
  $("#amx").classList.toggle("on", S.amx); $("#stm").classList.toggle("on", S.stems);
  $("#mosaic").innerHTML = S.list.slice(0, 4).map(s => `<img src="${esc(s.cover)}" alt="">`).join("");
  const tot = S.list.reduce((a, s) => a + (S.an[s.id] && S.an[s.id].dur || 0), 0);
  $("#sub").textContent = S.list.length ? `${S.list.length} canciones · ${Math.round(tot / 60)} min${S.amx ? " · Automix" : ""}` : "Añade canciones para empezar";
  if (!S.list.length) { $("#list").innerHTML = '<div class="empty">Busca y añade al menos dos canciones para ver sus transiciones.</div>'; return; }
  let h = "";
  S.list.forEach((s, i) => {
    const d = S.an[s.id];
    h += `<div class="row"><img src="${esc(s.cover)}" alt=""><div class="tt"><b>${esc(s.title)}</b><span>${esc(s.artist)}</span></div>
      <div class="meta">${d && !d.error ? `${Math.round(d.bpm)} bpm <span class="key" style="background:${keyCol(d.key)}">${esc(d.key.camelot)}</span> <span title="energía">⚡${d.energy}</span> <span>${esc(d.family)}</span>`
        : d && d.error ? `<span class="err">error</span>` : `<span class="busy">analizando…</span>`}</div>
      <div class="meta">${d && d.dur ? fmt(d.dur) : esc(s.duration || "")}</div>
      <div><button class="x" data-up="${i}" title="Subir">↑</button><button class="x" data-dn="${i}" title="Bajar">↓</button><button class="x" data-rm="${i}" title="Quitar">✕</button></div></div>`;
    if (S.amx && i < S.list.length - 1) h += `<div class="tr" id="tr${i}"><span class="busy">…</span></div>`;
  });
  $("#list").innerHTML = h;
  $("#list").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => removeAt(+b.dataset.rm));
  $("#list").querySelectorAll("[data-up]").forEach(b => b.onclick = () => move(+b.dataset.up, -1));
  $("#list").querySelectorAll("[data-dn]").forEach(b => b.onclick = () => move(+b.dataset.dn, 1));
  S.list.forEach(analyze);
  if (S.amx) S.list.slice(0, -1).forEach((s, i) => fillChip(i));
}
async function fillChip(i) {
  const a = S.list[i], b = S.list[i + 1], el = $("#tr" + i);
  if (!el) return;
  if (!S.an[a.id] || !S.an[b.id] || S.an[a.id].error || S.an[b.id].error) { el.innerHTML = '<span class="busy">esperando el análisis…</span>'; return; }
  try {
    const cu = S.custom[pairKey(a.id, b.id)];
    const P = await getPlans(a.id, b.id, cu && cu.bars);
    const c = cu ? P.find(x => x.tpl === cu.tpl) || P[0] : P[0];
    el.innerHTML = `<span class="chip ${cu ? "custom" : ""}">⇄ <b>${cu ? "Personalizada" : "Auto"}</b> · ${esc(c.label)} ›</span>`;
    el.firstChild.onclick = () => openEditor(i);
  } catch (e) { el.innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}

// ---------- editor de transicion
const E = { i: 0, P: [], tpl: null, bars: null, sa: 0, sb: 0, clip: null, au: new Audio(), raf: 0, rendering: null };
E.au.addEventListener("ended", () => paintPlay());
async function openEditor(i) {
  E.i = i; const a = S.list[i], b = S.list[i + 1], cu = S.custom[pairKey(a.id, b.id)];
  E.bars = cu ? cu.bars || null : null; E.sa = cu ? cu.sa || 0 : 0; E.sb = cu ? cu.sb || 0 : 0;
  E.P = await getPlans(a.id, b.id, E.bars);
  E.tpl = cu ? cu.tpl : null;   // null = Auto (la mejor)
  $("#sheet").classList.add("open"); paintEditor(); render();
}
function closeEditor() { E.au.pause(); cancelAnimationFrame(E.raf); $("#sheet").classList.remove("open"); }
$("#sheet").addEventListener("mousedown", (e) => { if (e.target.id === "sheet") closeEditor(); });
const curPlan = () => E.tpl ? E.P.find(x => x.tpl === E.tpl) || E.P[0] : E.P[0];
function shifted(c) {
  const A = S.an[S.list[E.i].id], B = S.an[S.list[E.i + 1].id], p = JSON.parse(JSON.stringify(c));
  const bA = 4 * A.per, bB = 4 * B.per;
  for (const k of ["ts", "tsw", "te", "tm", "tv", "bs"]) if (p[k] != null) p[k] += E.sa * bA;
  if (p.loop) p.loop = p.loop.map(x => x + E.sa * bA);
  p.b_in = Math.max(0, p.b_in + E.sb * bB);
  return p;
}
function trackRow(s) {
  const d = S.an[s.id];
  return `<div class="trk"><img src="${esc(s.cover)}" alt=""><div class="tt"><b>${esc(s.title)}</b><span>${esc(s.artist)}</span></div>
    <div class="meta">${d.bpm.toFixed(1)} bpm <span class="key" style="background:${keyCol(d.key)}">${esc(d.key.camelot)}</span> ${fmt(d.dur)}</div></div>`;
}
function paintEditor() {
  const a = S.list[E.i], b = S.list[E.i + 1], c = curPlan();
  const tpls = ["eq", "bucle", "voz", "inst", "corte", "fundido"];
  const NAMES = { eq: "Mezcla EQ", bucle: "Bucle de frase", voz: "Voz primero", inst: "Instrumental primero", corte: "Corte + eco", fundido: "Fundido por bandas" };
  const lenOK = ["eq", "bucle", "fundido"].includes(c.tpl);
  $("#ed").innerHTML = `<div class="edh"><button class="lnk" id="cancel">Cancelar</button><h3>Editar transición<span class="beta">LAB</span></h3><button class="save" id="save">Guardar</button></div>
    ${trackRow(a)}
    <div class="stage"><canvas class="ed-cv" id="cv"></canvas><button class="play" id="play">▶</button></div>
    ${trackRow(b)}
    <div class="ctl">
      <select id="bars" ${lenOK ? "" : "disabled"}>${[4, 8, 16, 32].map(n => `<option value="${n}" ${((E.bars || c.bars) == n) ? "selected" : ""}>${n} compases</option>`).join("")}</select>
      <button class="btn" data-s="A-">A ◀ compás</button><button class="btn" data-s="A+">A ▶</button>
      <button class="btn" data-s="B-">B ◀ compás</button><button class="btn" data-s="B+">B ▶</button>
      <span class="info">A ${E.sa >= 0 ? "+" : ""}${E.sa} · B ${E.sb >= 0 ? "+" : ""}${E.sb}</span>
    </div>
    <div class="presets">
      <button class="pre ${!E.tpl ? "sel" : ""}" data-t="">Auto<small>${esc(E.P[0].label)}</small></button>
      ${tpls.map(t => { const p = E.P.find(x => x.tpl === t); return `<button class="pre ${E.tpl === t ? "sel" : ""}" data-t="${t}" ${p ? "" : "disabled"}>${NAMES[t]}<small>${p ? "puntos " + p.score.toFixed(2) : "no encaja"}</small></button>`; }).join("")}
    </div>
    <ul class="why">${c.why.map(w => `<li>${esc(w)}</li>`).join("")}</ul>
    <div class="leg"><span><i style="background:var(--a)"></i>volumen A</span><span><i style="background:var(--b)"></i>volumen B</span>
      <span><i style="background:repeating-linear-gradient(90deg,var(--a) 0 3px,transparent 3px 6px)"></i>graves A</span>
      <span><i style="background:repeating-linear-gradient(90deg,var(--b) 0 3px,transparent 3px 6px)"></i>graves B</span>
      <span><i style="background:var(--voc)"></i>voz separada</span><span>| compases de A</span></div>
    <div class="info" id="info"></div>`;
  $("#cancel").onclick = closeEditor;
  $("#save").onclick = () => { const k = pairKey(a.id, b.id); if (!E.tpl && !E.bars && !E.sa && !E.sb) delete S.custom[k]; else S.custom[k] = { tpl: c.tpl, bars: E.bars, sa: E.sa, sb: E.sb }; save(); closeEditor(); paint(); };
  $("#play").onclick = togglePlay;
  $("#bars").onchange = async (e) => { E.bars = +e.target.value; E.P = await getPlans(a.id, b.id, E.bars); paintEditor(); render(); };
  $("#ed").querySelectorAll("[data-s]").forEach(x => x.onclick = () => { const s = x.dataset.s; if (s[0] === "A") E.sa += s[1] === "+" ? 1 : -1; else E.sb += s[1] === "+" ? 1 : -1; paintEditor(); render(); });
  $("#ed").querySelectorAll("[data-t]").forEach(x => x.onclick = () => { E.tpl = x.dataset.t || null; paintEditor(); render(); });
  const cv = $("#cv");
  cv.onclick = (e) => { if (!E.clip) return; const r = cv.getBoundingClientRect(); E.au.currentTime = (e.clientX - r.left) / r.width * E.clip.info.dur; E.au.play(); paintPlay(); };
  draw();
}
async function render() {
  const a = S.list[E.i], b = S.list[E.i + 1], plan = shifted(curPlan()), key = JSON.stringify(plan);
  E.rendering = key; E.clip = null; E.au.pause(); draw(); $("#info").textContent = "Renderizando…";
  try {
    const d = await jget("/api/render", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ a: a.id, b: b.id, plan, stems: S.stems }) });
    if (E.rendering !== key) return;
    E.clip = d; E.au.src = d.url;
    $("#info").textContent = `${curPlan().label} · clip ${d.info.dur.toFixed(1)} s · B estirada ${((d.info.speed - 1) * 100).toFixed(1)}% · B ${d.info.gainB >= 0 ? "+" : ""}${d.info.gainB} dB · voz separada: ${d.info.stems ? "sí" : "no"} · render ${d.info.renderSecs}s`;
    draw();
  } catch (e) { $("#info").innerHTML = `<span class="err">${esc(e.message)}</span>`; }
}
function togglePlay() { if (!E.clip) return; if (E.au.paused) E.au.play(); else E.au.pause(); paintPlay(); }
function paintPlay() {
  const p = $("#play"); if (!p) return;
  p.textContent = E.au.paused ? "▶" : "❚❚"; p.classList.toggle("hide", !E.au.paused);
  cancelAnimationFrame(E.raf);
  const loop = () => { draw(); if (!E.au.paused) E.raf = requestAnimationFrame(loop); };
  loop();
}
function draw() {
  const cv = $("#cv"); if (!cv) return;
  const dpr = devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== Math.round(W * dpr)) { cv.width = W * dpr; cv.height = H * dpr; }
  const g = cv.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, W, H);
  if (!E.clip) { g.fillStyle = "#8d95a3"; g.font = "13px system-ui"; g.fillText("Renderizando la transición…", 16, 24); return; }
  const v = E.clip.info.viz, dur = E.clip.info.dur, A = S.an[S.list[E.i].id];
  const lane = (pk, y0, h, col, vol) => {
    const n = pk.length;
    for (let i = 0; i < n; i++) {
      const x = i / n * W, a = Math.max(.5, pk[i] * h * .95), k = Math.min(1, vol[Math.floor(i / n * vol.length)] || 0);
      g.fillStyle = col; g.globalAlpha = .18 + .62 * k; g.fillRect(x, y0 + h - a, Math.max(1, W / n), 2 * a);
    }
    g.globalAlpha = 1;
  };
  const top = 18, laneH = (H - 36) / 4;
  // compases de A (reloj del clip)
  const bar = 4 * A.per, t0 = E.clip.info.t0;
  g.strokeStyle = "rgba(255,255,255,.06)";
  for (let t = A.bar0 + Math.ceil((t0 - A.bar0) / bar) * bar; t < t0 + dur; t += bar) { const x = (t - t0) / dur * W; g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
  lane(v.A, top, laneH, "#cfd6e0", v.aVol);
  lane(v.B, top + 2 * laneH, laneH, "#cfd6e0", v.bVol);
  // curvas
  const curve = (arr, col, dash, w) => { if (!arr) return; g.strokeStyle = col; g.lineWidth = w || 2; g.setLineDash(dash || []); g.beginPath();
    arr.forEach((y, i) => { const x = i / (arr.length - 1) * W, yy = H - 14 - Math.min(1.1, y) / 1.1 * (H - 34); i ? g.lineTo(x, yy) : g.moveTo(x, yy); }); g.stroke(); g.setLineDash([]); };
  curve(v.aVol, getComputedStyle(document.body).getPropertyValue("--a"), [], 2.2);
  curve(v.bVol, getComputedStyle(document.body).getPropertyValue("--b"), [], 2.2);
  curve(v.aBass, getComputedStyle(document.body).getPropertyValue("--a"), [4, 4], 1.4);
  curve(v.bBass, getComputedStyle(document.body).getPropertyValue("--b"), [4, 4], 1.4);
  curve(v.aVoc, getComputedStyle(document.body).getPropertyValue("--voc"), [1, 3], 1.4);
  curve(v.bVoc, getComputedStyle(document.body).getPropertyValue("--voc"), [], 1.2);
  // marcas
  g.font = "11px system-ui";
  E.clip.marks.forEach((m, i) => { const x = m.t / dur * W; g.strokeStyle = "rgba(127,209,255,.55)"; g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke();
    g.fillStyle = "#cfe9f7"; g.fillText(m.txt, Math.min(W - 130, x + 4), 12 + (i % 2) * 13); });
  // cursor
  const x = E.au.currentTime / dur * W; g.fillStyle = "#fff"; g.fillRect(x, 0, 2, H);
}
addEventListener("resize", () => draw());
addEventListener("keydown", (e) => { if ($("#sheet").classList.contains("open")) { if (e.key === " ") { e.preventDefault(); togglePlay(); } if (e.key === "Escape") closeEditor(); } });
paint();
</script>
