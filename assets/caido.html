  :root { --bg: #060608; --fg: #f2f3f7; --mut: rgb(242 243 247 / .62); --acc: #2e7dff; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  body { display: grid; place-items: center; overflow: hidden; padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); }
  .glow { position: fixed; inset: -30%; pointer-events: none; filter: blur(70px); opacity: .55;
    background: radial-gradient(40% 35% at 35% 40%, rgb(46 125 255 / .45), transparent 70%),
                radial-gradient(35% 30% at 68% 62%, rgb(140 82 255 / .32), transparent 70%);
    animation: drift 18s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate3d(4%, -3%, 0) scale(1.08) rotate(8deg); } }
  main { position: relative; width: min(420px, 100%); text-align: center; }
  .logo { width: 132px; height: 132px; color: #fff; display: block; margin: 0 auto 6px; }
  .logo circle { transform-box: fill-box; transform-origin: center; animation: dot 2.6s ease-in-out infinite; }
  .logo circle:nth-child(3n+1) { animation-delay: -.4s; } .logo circle:nth-child(3n+2) { animation-delay: -1.1s; }
  .logo circle:nth-child(5n) { animation-delay: -1.8s; }
  @keyframes dot { 0%, 100% { opacity: .35; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  .word { font-family: "Doto", system-ui, sans-serif; font-variation-settings: "ROND" 100; font-weight: 800;
    font-size: 2.1rem; line-height: 1; letter-spacing: 0; margin: 0 0 26px; }
  h1 { font-size: 1.32rem; font-weight: 700; margin: 0 0 10px; letter-spacing: -.01em; }
  p { margin: 0 auto; color: var(--mut); line-height: 1.5; font-size: .98rem; max-width: 34ch; }
  .st { margin-top: 26px; display: inline-flex; align-items: center; gap: 10px; font-size: .86rem; color: var(--mut);
    padding: 9px 14px; border-radius: 999px; background: rgb(255 255 255 / .06); border: 1px solid rgb(255 255 255 / .08); }
  .sp { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .18); border-top-color: var(--fg);
    animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  button { margin-top: 18px; display: block; margin-inline: auto; font: inherit; font-weight: 700; font-size: .95rem; color: #08090c;
    background: var(--fg); border: 0; border-radius: 999px; padding: 12px 26px; cursor: pointer; transition: transform .15s; }
  button:active { transform: scale(.97); }
  @media (prefers-reduced-motion: reduce) { .glow, .logo circle, .sp { animation: none; } }
</style>
</head>

<script>
(() => {
  const en = !/^es\b/i.test(navigator.language || "es");
  const T = en ? { t: "Wave is not available right now", d: "The server is restarting or went offline. We'll reconnect you as soon as it's back.",
                   s: (n) => "Retrying in " + n + " s…", n: "No internet connection", c: "Checking…", r: "Retry now" }
               : { t: "Wave no está disponible ahora mismo", d: "El servidor se está reiniciando o se quedó sin conexión. En cuanto vuelva, te reconectamos solo.",
                   s: (n) => "Reintentando en " + n + " s…", n: "Sin conexión a internet", c: "Comprobando…", r: "Reintentar ahora" };
  const $ = (i) => document.getElementById(i);
  $("t").textContent = T.t; $("d").textContent = T.d; $("r").textContent = T.r;
  if (en) document.documentElement.lang = "en";
  let left = 6, wait = 6, busy = false;
  async function check() {
    if (busy) return;
    busy = true; $("s").textContent = T.c;
    try {
      // el servidor responde (o Cloudflare pide verificar el acceso): de vuelta a la app
      const r = await fetch("/salud?t=" + Date.now(), { cache: "no-store", redirect: "manual" });
      if (r.ok || r.type === "opaqueredirect" || r.status === 401 || r.status === 403) {
        if (/caido\.html$/.test(location.pathname)) location.replace("/"); else location.reload();
        return;
      }
    } catch (e) {}
    busy = false; wait = Math.min(30, Math.round(wait * 1.5)); left = wait; tick();
  }
  function tick() { $("s").textContent = navigator.onLine === false ? T.n : T.s(left); }
  setInterval(() => { if (busy) return; if (--left <= 0) check(); else tick(); }, 1000);
  $("r").onclick = () => { wait = 6; check(); };
  addEventListener("online", () => { wait = 6; check(); });
  tick();
})();
</script>
